<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40"
     role="img" aria-label="PadelIndex">
  <title>PadelIndex</title>
  <!--
    Marke = drei Aussagen, jede genau einmal:
      Ring (offen)  -> Confidence: das Rating hat einen Genauigkeitsgrad
      Balken        -> Index: es steigt durch gespielte Matches
      Punkt am Ende -> der Ball, das Ende des offenen Bogens
  -->
  <g fill="none" stroke="currentColor" stroke-width="3">
    <!-- Confidence-Ring, ~78 % geschlossen. Umfang 2*pi*13 = 81.68 -->
    <circle cx="20" cy="20" r="13"
            stroke-dasharray="63.7 81.68"
            stroke-linecap="round"
            transform="rotate(-90 20 20)"
            opacity="0.9"/>
  </g>
  <!-- Index-Balken: steigend, tabellarisch gleich breit -->
  <g fill="currentColor">
    <rect x="12.6" y="21.5" width="3" height="6"   rx="1.5"/>
    <rect x="18.5" y="17.5" width="3" height="10"  rx="1.5"/>
    <rect x="24.4" y="13.5" width="3" height="14"  rx="1.5"/>
  </g>
  <!-- Ball am offenen Ende des Bogens -->
  <circle cx="7.2" cy="17.6" r="2.9" fill="currentColor"/>
</svg>
